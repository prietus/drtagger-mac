# XcodeGen spec. Regenerate the project after editing with:
#   xcodegen generate
# The generated drtagger.xcodeproj is git-ignored.
name: drtagger
options:
  bundleIdPrefix: us.priet
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "27.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Every build is signed with the Developer ID certificate (manual
    # signing, no profile needed without restricted entitlements) so the app
    # keeps a stable code identity across rebuilds; with ad hoc signing each
    # build is a new identity and macOS re-asks Keychain permission for the
    # stored API keys, which looks like a hang when the prompt is hidden.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: LFTD9T269J
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

packages:
  FLACKit:
    path: Packages/FLACKit
  Chromaprint:
    path: Packages/Chromaprint
  ProviderKit:
    path: Packages/ProviderKit
  LibraryKit:
    path: Packages/LibraryKit
  SplitKit:
    path: Packages/SplitKit
  SACDKit:
    path: Packages/SACDKit
  DSTKit:
    path: Packages/DSTKit
  IdentifyKit:
    path: Packages/IdentifyKit
  TagKit:
    path: Packages/TagKit
  LoudnessKit:
    path: Packages/LoudnessKit

targets:
  drtagger:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: FLACKit
        product: FLACKit
      - package: Chromaprint
        product: ChromaprintKit
      - package: ProviderKit
        product: ProviderKit
      - package: LibraryKit
        product: LibraryKit
      - package: SplitKit
        product: SplitKit
      - package: SACDKit
        product: SACDKit
      - package: DSTKit
        product: DSTKit
      - package: IdentifyKit
        product: IdentifyKit
      - package: TagKit
        product: TagKit
      - package: LoudnessKit
        product: LoudnessKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: drtagger
        CFBundleDisplayName: drtagger
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # CUETools DB only speaks plain HTTP (no TLS on db.cuetools.net /
        # p.cuetools.net, checked 2026-09-20). It serves public checksums, so
        # an ATS exception for that domain is acceptable.
        NSAppTransportSecurity:
          NSExceptionDomains:
            cuetools.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: App/drtagger.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.priet.drtagger-mac
        PRODUCT_NAME: drtagger
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: Embed ffmpeg
        script: '"$SRCROOT/scripts/embed-ffmpeg.sh"'
        basedOnDependencyAnalysis: false

  drtaggerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DrtaggerTests
    dependencies:
      - target: drtagger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.priet.drtagger-mac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  drtagger:
    build:
      targets:
        drtagger: all
        drtaggerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - drtaggerTests
    profile:
      config: Release
    archive:
      config: Release
